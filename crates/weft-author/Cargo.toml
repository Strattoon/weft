[package]
name = "weft-author"
version = "0.1.0"
edition = "2021"

[dependencies]
weft-evals = { workspace = true }
weft-catalog = { workspace = true }
weft-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# Optional — only pulled in when the `providers` feature is enabled.
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
weft-compiler = { path = "../weft-compiler", optional = true }
tempfile = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Live model providers are opt-in; the deterministic core + MockAuthor need none.
providers = ["dep:tokio", "dep:reqwest", "dep:async-trait", "dep:clap", "dep:weft-compiler", "dep:tempfile"]
# Dashboard = axum HTTP server + graph view; pulls in providers.
dashboard = ["providers", "dep:axum", "dep:tower-http"]
